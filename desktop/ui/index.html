<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Friday 启动中</title>
<!-- 启动占位页：外壳解析内核 stdout 的 FRIDAY_ADDR 后 emit server-ready，本页跳转过去。
     首装未确认数据目录时先进入应用内向导（/wizard.html：建账号 → 确认目录）。 -->
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    background: #171717; color: #e8e8e8;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  /* 品牌标基准：白底 + 中心黑点（圆角 = 边长 28%、圆点 = 边长 44%）。
     网页侧 .brand-mark、favicon 与 scripts/gen-icon.py 出的 App 图标都按这套几何，
     改这里要同时改那三处。 */
  #logo { width: 72px; height: 72px; border-radius: 20px; position: relative;
    background: #e8e8e8; }
  #logo::after { content: ""; position: absolute; inset: 20px; border-radius: 50%;
    background: rgba(20, 20, 20, .92); }
  h1 { font-size: 18px; font-weight: 500; }
  #status { font-size: 13px; color: rgba(232, 232, 232, .55); text-align: center; }
  #bar { width: 180px; height: 4px; border-radius: 2px; overflow: hidden;
    background: rgba(255, 255, 255, .1); }
  #bar i { display: block; width: 40%; height: 100%; border-radius: 2px;
    background: #e8e8e8;
    animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(450%); } }
  .err { color: #f87171; }
</style>
</head>
<body>
  <div id="logo"></div>
  <h1>Friday 个人管家</h1>
  <div id="bar"><i></i></div>
  <div id="status">正在启动本地内核…</div>
<script>
  const status = document.getElementById('status');
  let entered = false;

  function enter(url) {
    if (entered) return;
    entered = true;
    status.textContent = '内核已就绪，正在进入…';
    location.replace(url);
  }
  function showDead(reason) {
    if (entered) return;
    entered = true;
    status.classList.add('err');
    status.textContent = '内核已退出' + (reason ? '：' + reason : '') + '。请先从托盘菜单退出 Friday，再重新打开；详见数据目录 friday-kernel.log。';
  }
  function applyState(s) {
    // 首装未确认数据目录 → 应用内向导（建账号 → 确认目录 → 重启内核 → 登录）。
    if (s.addr) enter(s.addr + (s.needsDirSetup ? '/wizard' : ''));
    else if (s.dead) showDead(s.reason);
    return !!(s.addr || s.dead);
  }

  async function boot() {
    if (!window.__TAURI__) {
      // 无外壳环境（浏览器直接打开占位页）：仅提示，不做启动编排。
      status.textContent = '未检测到桌面外壳：请从已安装的 Friday 应用启动。';
      return;
    }
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;
    // 三重保障防竞态：① 先查一次当前状态（事件可能在页面加载前就已发过）；
    // ② 监听后续事件；③ 兜底轮询（事件丢失也能进入）。死因同理由 kernel_state 查询。
    if (applyState(await invoke('kernel_state'))) return;
    // 事件只带地址，向导标记要重查完整状态（否则首装会绕过向导直接进入）。
    await listen('server-ready', async () => applyState(await invoke('kernel_state')));
    await listen('kernel-dead', (e) => showDead(e.payload));
    const poll = setInterval(async () => {
      if (applyState(await invoke('kernel_state'))) clearInterval(poll);
    }, 1500);
    setTimeout(() => {
      if (!entered) status.textContent = '仍在启动…若超过一分钟无响应，请重启应用并查看数据目录 friday-kernel.log';
    }, 30000);
  }
  boot();
</script>
</body>
</html>
