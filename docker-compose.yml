services:
  friday:
    build:
      context: .
      # Go 依赖走仓库内 vendor/，前端产物由 node 阶段构建：零网络依赖，无需凭据
    image: friday:latest
    container_name: friday
    restart: unless-stopped
    stdin_open: true # 诊断期：保留 stdin 供 docker attach 走 REPL 触发请求
    extra_hosts:
      - "host.docker.internal:host-gateway" # 诊断期：访问宿主机记录代理
    # ADMIN_PORT 同时控制容器监听、映射和健康检查；FRIDAY_HOST_PORT 控制宿主端口。
    ports:
      - "${FRIDAY_HOST_PORT:-8090}:${ADMIN_PORT:-8080}"
    volumes:
      # 全部可变数据（config.yaml/session/tasks/memories/uploads/HEARTBEAT.md）
      - ./data:/data
    environment:
      - TZ=Asia/Shanghai
      - ADMIN_HOST=${ADMIN_HOST:-0.0.0.0}
      - ADMIN_PORT=${ADMIN_PORT:-8080}
    # API 密钥等敏感环境变量放 .env（STEP_API_KEY=sk-...），不入库
    env_file:
      - path: .env
        required: false
