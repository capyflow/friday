<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方向 C · 新粗野主义（Neo-Brutalism）— 小五</title>
<!--
  设计稿（非生产代码）：方向 C —— 新粗野主义
  依据：ui-ux-pro-max / brutalism（700+ 粗字重、2-4px 可见边框、高对比、
  大色块），采用现代新粗野改良：奶油底 + 2px 墨线 + 硬投影 + 单一烈橙。
-->
<style>
  :root {
    --bg: #F7F0E3;
    --card: #FFFFFF;
    --ink: #17140F;
    --muted: #6E675C;
    --orange: #FF5C00;
    --yellow: #FFD84D;
    --mint: #9FE7C0;
    --radius: 12px;
    --border: 2px solid var(--ink);
    --hard: 5px 5px 0 var(--ink);
    --hard-sm: 3px 3px 0 var(--ink);
    --tr: 120ms ease;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "MiSans", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.6;
    -webkit-font-smoothing: antialiased; overflow: hidden;
    background-image: radial-gradient(rgba(23,20,15,.07) 1px, transparent 1px);
    background-size: 22px 22px;
  }
  #app { display: flex; height: 100vh; }

  /* 侧栏：奶油面板 + 墨线 */
  #sidebar { width: 230px; flex: none; display: flex; flex-direction: column;
    padding: 20px 14px 16px; background: var(--card);
    border-right: var(--border); }
  .brand { display: flex; align-items: center; gap: 11px; padding: 2px 8px 22px; }
  .brand .avatar { width: 42px; height: 42px; border-radius: 50%; flex: none;
    background: var(--orange); border: var(--border); color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 800; box-shadow: var(--hard-sm); }
  .brand b { font-size: 18px; font-weight: 900; letter-spacing: .12em; }
  #nav { display: flex; flex-direction: column; gap: 6px; }
  .nav-item { display: flex; align-items: center; gap: 10px; min-height: 42px; width: 100%;
    text-align: left; border: var(--border); background: var(--card); padding: 0 12px;
    border-radius: 10px; font-size: 14px; font-weight: 700; color: var(--ink);
    transition: all var(--tr); cursor: pointer; }
  .nav-item:hover { transform: translate(-2px,-2px); box-shadow: var(--hard-sm); }
  .nav-item.active { background: var(--yellow); box-shadow: var(--hard-sm); }
  .nav-item svg { flex: none; }
  .grow { flex: 1; }
  #whoBox { border-top: var(--border); padding: 12px 4px 0; font-size: 12px; color: var(--muted); }
  #whoBox .who-line { display: flex; align-items: center; gap: 7px; margin-bottom: 10px;
    font-weight: 800; color: var(--ink); }
  #btnLogout { width: 100%; display: flex; align-items: center; justify-content: center; gap: 7px;
    background: var(--card); border: var(--border); color: var(--ink);
    border-radius: 10px; padding: 9px 15px; font-size: 14px; font-weight: 800; cursor: pointer;
    transition: all var(--tr); }
  #btnLogout:hover { transform: translate(-2px,-2px); box-shadow: var(--hard-sm); background: #FFE9E0; }

  /* 主区 */
  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #chatHead { display: flex; align-items: center; gap: 10px; padding: 14px 24px;
    border-bottom: var(--border); background: var(--bg); }
  #chatHead .title { font-size: 15px; font-weight: 900; flex: 1; }
  #chatHead .title em { font-style: normal; background: var(--yellow); padding: 1px 8px;
    border: var(--border); border-radius: 6px; box-shadow: var(--hard-sm); }
  .btn-icon { width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
    background: var(--card); border: var(--border); border-radius: 10px;
    color: var(--ink); cursor: pointer; transition: all var(--tr); box-shadow: var(--hard-sm); }
  .btn-icon:hover { transform: translate(-2px,-2px); box-shadow: 5px 5px 0 var(--ink); }

  #chatScroller { flex: 1; overflow-y: auto; padding: 24px 18px 8px; }
  #msgList { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .mrow { display: flex; gap: 8px; align-items: flex-end; }
  .mrow.user { flex-direction: row-reverse; }
  .bubble { max-width: 78%; padding: 11px 16px; border-radius: 14px; font-size: 15px;
    line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
  .mrow.bot .bubble { background: var(--card); border: var(--border);
    border-bottom-left-radius: 4px; box-shadow: var(--hard); }
  .mrow.user .bubble { background: var(--orange); color: var(--ink); border: var(--border);
    border-bottom-right-radius: 4px; box-shadow: var(--hard); font-weight: 600; }
  .bubble b { background: var(--yellow); padding: 0 3px; border-radius: 4px; }
  .mrow.bot .bubble code { background: var(--mint); border: 1.5px solid var(--ink);
    padding: 0 6px; border-radius: 6px;
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
  .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink);
    animation: jump 1s steps(4) infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; }
  .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes jump { 0%,60%,100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-4px); opacity: 1; } }

  #chatFoot { padding: 12px 18px 20px; }
  .inputbar { max-width: 680px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end;
    background: var(--card); border: var(--border); border-radius: 14px;
    padding: 9px 9px 9px 16px; box-shadow: var(--hard); transition: all var(--tr); }
  .inputbar:focus-within { transform: translate(-2px,-2px); box-shadow: 7px 7px 0 var(--ink); }
  .inputbar textarea { flex: 1; border: none; resize: none; background: transparent; outline: none;
    color: var(--ink); font: inherit; font-size: 15px; line-height: 1.5; max-height: 120px;
    padding: 7px 0; }
  .inputbar textarea::placeholder { color: #A89F8F; }
  .btn-send { width: 42px; height: 42px; display: flex; align-items: center; justify-content: center;
    background: var(--orange); color: var(--ink); border: var(--border); border-radius: 10px;
    cursor: pointer; box-shadow: var(--hard-sm); transition: all var(--tr); }
  .btn-send:hover { transform: translate(-2px,-2px); box-shadow: 5px 5px 0 var(--ink); }
  .btn-clip { width: 42px; height: 42px; display: flex; align-items: center; justify-content: center;
    background: var(--card); border: var(--border); border-radius: 10px;
    color: var(--ink); cursor: pointer; transition: all var(--tr); }
  .btn-clip:hover { transform: translate(-2px,-2px); box-shadow: var(--hard-sm); }

  /* 审批卡片 */
  #approvalBar { position: fixed; right: 22px; bottom: 22px; z-index: 90; width: 372px; }
  .approval-card { background: var(--yellow); border: var(--border); border-radius: 14px;
    padding: 14px 16px; box-shadow: 6px 6px 0 var(--ink); }
  .approval-card h4 { margin: 0 0 6px; font-size: 13px; font-weight: 900; }
  .approval-card pre { margin: 6px 0 10px; font-size: 12px; white-space: pre-wrap; word-break: break-all;
    max-height: 120px; overflow: auto; background: var(--card); border: 2px solid var(--ink);
    border-radius: 8px; padding: 8px 10px; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .acts { display: flex; gap: 8px; justify-content: flex-end; }
  .acts .abtn { border-radius: 9px; padding: 8px 13px; font-size: 13px; font-weight: 800;
    cursor: pointer; transition: all var(--tr); border: var(--border);
    background: var(--card); color: var(--ink); }
  .acts .abtn:hover { transform: translate(-2px,-2px); box-shadow: var(--hard-sm); }
  .acts .abtn.primary { background: var(--orange); }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand"><div class="avatar">五</div><b>小五</b></div>
    <nav id="nav">
      <button class="nav-item active"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>聊天</button>
      <button class="nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>运行状态</button>
      <button class="nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>调用轨迹</button>
      <button class="nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>自动化</button>
      <button class="nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>待办</button>
      <button class="nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>记忆</button>
      <button class="nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>设置</button>
    </nav>
    <div class="grow"></div>
    <div id="whoBox">
      <div class="who-line"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>admin</div>
      <button id="btnLogout"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>退出登录</button>
    </div>
  </aside>

  <main id="main">
    <div id="chatHead">
      <div class="title"><em>聊天</em></div>
      <button class="btn-icon"><svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg></button>
    </div>
    <div id="chatScroller">
      <div id="msgList">
        <div class="mrow user"><div class="bubble">帮我记个待办：周五早上还书</div></div>
        <div class="mrow bot"><div class="bubble">已记入待办 <b>周五早上还书</b>，到时我会提醒你 📚</div></div>
        <div class="mrow user"><div class="bubble">上海今天天气怎么样？</div></div>
        <div class="mrow bot"><div class="bubble">上海今天 <b>多云转晴</b>，22–27°C，东南风 3 级。
- 早晚偏凉，出门带件薄外套
- 午后紫外线较强，注意防晒</div></div>
        <div class="mrow bot"><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div></div>
      </div>
    </div>
    <div id="chatFoot">
      <div class="inputbar">
        <button class="btn-clip"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></button>
        <textarea rows="1" placeholder="和小五说点什么…"></textarea>
        <button class="btn-send"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button>
      </div>
    </div>
  </main>
</div>

<div id="approvalBar">
  <div class="approval-card">
    <h4>⚠️ 危险操作待审批</h4>
    <pre>exec: rm -rf /tmp/friday-cache</pre>
    <div class="acts">
      <button class="abtn">拒绝</button>
      <button class="abtn">批准并记住</button>
      <button class="abtn primary">批准</button>
    </div>
  </div>
</div>
</body>
</html>
