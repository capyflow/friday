    <div class="grow"></div>
    <div id="whoBox">
      <div class="who-line">admin</div>
      <button id="btnLogout">退出登录</button>
    </div>
  </aside>

  <main id="main">
    <section class="view">
      <div class="view-inner">
        <h2><span class="hl">自动化</span> <span class="count">4 条</span></h2>
        <div class="panel">
          <div class="panel-title"><span class="tag">NEW</span>新建任务</div>
          <form>
            <select style="min-width:110px"><option>单次</option><option>多次</option><option>循环</option><option>智能任务</option></select>
            <input class="w1" placeholder="任务内容，如：该敷面膜了">
            <input style="min-width:200px" placeholder="10分钟后 / 2026-09-01T20:00:00+08:00">
            <button class="btn primary" type="button">添加任务</button>
          </form>
          <table>
            <thead><tr><th>类型</th><th>内容</th><th>计划</th><th>下次触发</th><th></th></tr></thead>
            <tbody>
              <tr><td><span class="badge once">单次</span></td><td>10 分钟后提醒我喝水</td><td class="meta">—</td><td class="mono">09-30 10:42</td><td><button class="btn sm danger">取消</button></td></tr>
              <tr><td><span class="badge repeat">多次</span></td><td>番茄钟休息提醒</td><td class="meta">每 25分钟 ×4/4</td><td class="mono">09-30 11:05</td><td><button class="btn sm danger">取消</button></td></tr>
              <tr><td><span class="badge cron">循环</span></td><td>早上问好 + 今日天气</td><td class="meta">cron: 0 8 * * *</td><td class="mono">10-01 08:00</td><td><button class="btn sm danger">取消</button></td></tr>
              <tr><td><span class="badge agent">智能</span></td><td>看看 notes.txt，把今天要做的事告诉我</td><td class="meta">agent · cron: 0 9 * * *</td><td class="mono">10-01 09:00</td><td><button class="btn sm danger">取消</button></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>
</div>
</body>
</html>
