<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>快捷面板 · 小五</title>
<link rel="stylesheet" href="c.css">
<style>
  /* 模拟桌面背景（快捷面板是浮在桌面上的透明窗口） */
  body { background: linear-gradient(140deg, #232048 0%, #3B2B58 45%, #1D3A4A 100%); }
  .backdrop { position: fixed; inset: 0; filter: blur(60px); opacity: .5; }
  .backdrop i { position: absolute; border-radius: 50%; }
  .backdrop i:nth-child(1) { width: 420px; height: 420px; left: 8%; top: 12%; background: radial-gradient(circle, rgba(124,92,255,.7), transparent 65%); }
  .backdrop i:nth-child(2) { width: 460px; height: 460px; right: 6%; bottom: -10%; background: radial-gradient(circle, rgba(45,212,255,.5), transparent 65%); }
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"><i></i><i></i></div>
<div class="pal-shell" style="position:relative">
  <div id="palPanel">
    <div id="palHead">
      <div id="palLogo"></div>
      <input id="palQ" placeholder="问小五任何事，或让它安排事项…" autofocus>
      <span id="palHint">Esc 关闭</span>
    </div>
    <div id="palAnswer">明早 9 点有会，已提前 15 分钟设提醒；今天气温 22–27°C，早晚偏凉建议带外套。</div>
    <div id="palStatus"></div>
  </div>
</div>
</body>
</html>
