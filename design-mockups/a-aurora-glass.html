<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方向 A · 极光玻璃（Aurora Glass）— 小五</title>
<!--
  设计稿（非生产代码）：方向 A —— 深色玻璃拟态
  依据：ui-ux-pro-max / glassmorphism（backdrop blur 10-20px、半透明白 10-30%、
  1px 亮边框、vibrant 背景；深色模式支持；需过 4.5:1 对比）
-->
<style>
  :root {
    --bg: #0A0A16;
    --glass: rgba(255,255,255,.055);
    --glass-strong: rgba(255,255,255,.09);
    --line: rgba(255,255,255,.09);
    --line-strong: rgba(255,255,255,.16);
    --fg: #F2F2FA;
    --muted: rgba(242,242,250,.55);
    --violet: #7C5CFF;
    --cyan: #2DD4FF;
    --pink: #FF5C8A;
    --grad: linear-gradient(135deg, #7C5CFF, #4B9FFF);
    --radius: 16px;
    --tr: 180ms ease;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "MiSans", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--fg); font-size: 15px; line-height: 1.6;
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  /* 极光背景 */
  .aurora { position: fixed; inset: 0; z-index: 0; filter: blur(90px); opacity: .5; }
  .aurora i { position: absolute; border-radius: 50%; }
  .aurora i:nth-child(1) { width: 560px; height: 560px; left: -120px; top: -180px;
    background: radial-gradient(circle, rgba(124,92,255,.85), transparent 65%); }
  .aurora i:nth-child(2) { width: 640px; height: 640px; right: -180px; top: -120px;
    background: radial-gradient(circle, rgba(45,212,255,.55), transparent 65%); }
  .aurora i:nth-child(3) { width: 520px; height: 520px; left: 34%; bottom: -260px;
    background: radial-gradient(circle, rgba(255,92,138,.4), transparent 65%); }

  #app { position: relative; z-index: 1; display: flex; height: 100vh; }

  /* 侧栏：玻璃 */
  #sidebar { width: 224px; flex: none; display: flex; flex-direction: column;
    padding: 22px 14px 16px;
    background: rgba(255,255,255,.045);
    border-right: 1px solid var(--line);
    backdrop-filter: blur(20px) saturate(140%); -webkit-backdrop-filter: blur(20px) saturate(140%); }
  .brand { display: flex; align-items: center; gap: 11px; padding: 2px 8px 24px; }
  .brand .avatar { width: 40px; height: 40px; border-radius: 14px; flex: none;
    background: var(--grad); color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 800;
    box-shadow: 0 8px 24px rgba(124,92,255,.45), inset 0 1px 0 rgba(255,255,255,.35); }
  .brand b { font-size: 17px; font-weight: 700; letter-spacing: .14em; }
  #nav { display: flex; flex-direction: column; gap: 3px; }
  .nav-item { display: flex; align-items: center; gap: 10px; min-height: 42px; width: 100%;
    text-align: left; border: none; background: none; padding: 0 12px;
    border-radius: 12px; font-size: 14px; font-weight: 500; color: var(--muted);
    transition: background var(--tr), color var(--tr); cursor: pointer; }
  .nav-item:hover { background: rgba(255,255,255,.06); color: var(--fg); }
  .nav-item.active { background: linear-gradient(135deg, rgba(124,92,255,.32), rgba(75,159,255,.18));
    color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }
  .nav-item svg { flex: none; }
  .grow { flex: 1; }
  #whoBox { border-top: 1px solid var(--line); padding: 12px 8px 0; font-size: 12px; color: var(--muted); }
  #whoBox .who-line { display: flex; align-items: center; gap: 7px; margin-bottom: 8px;
    font-weight: 600; color: var(--fg); }
  #btnLogout { width: 100%; display: flex; align-items: center; justify-content: center; gap: 7px;
    background: rgba(255,255,255,.05); border: 1px solid var(--line-strong); color: var(--muted);
    border-radius: 12px; padding: 9px 15px; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: all var(--tr); }
  #btnLogout:hover { color: var(--fg); border-color: rgba(255,255,255,.3); }

  /* 主区 */
  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #chatHead { display: flex; align-items: center; gap: 10px; padding: 14px 24px;
    border-bottom: 1px solid var(--line); }
  #chatHead .title { font-size: 14px; font-weight: 600; flex: 1; letter-spacing: .04em; color: var(--muted); }
  .btn-icon { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
    background: var(--glass); border: 1px solid var(--line-strong); border-radius: 12px;
    color: var(--muted); cursor: pointer; transition: all var(--tr); }
  .btn-icon:hover { color: var(--fg); border-color: rgba(255,255,255,.3); }

  #chatScroller { flex: 1; overflow-y: auto; padding: 24px 18px 8px; }
  #msgList { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .mrow { display: flex; gap: 8px; align-items: flex-end; }
  .mrow.user { flex-direction: row-reverse; }
  .bubble { max-width: 78%; padding: 11px 16px; border-radius: 18px; font-size: 15px;
    line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
  .mrow.bot .bubble { background: var(--glass); border: 1px solid var(--line);
    backdrop-filter: blur(20px) saturate(140%); -webkit-backdrop-filter: blur(20px) saturate(140%);
    border-bottom-left-radius: 6px; box-shadow: 0 8px 28px rgba(0,0,0,.25); }
  .mrow.user .bubble { background: var(--grad); color: #fff; border-bottom-right-radius: 6px;
    box-shadow: 0 8px 24px rgba(124,92,255,.35); }
  .bubble b { color: inherit; }
  .mrow.bot .bubble code { background: rgba(255,255,255,.1); padding: 1px 6px; border-radius: 6px;
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
  .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: rgba(242,242,250,.5);
    animation: jump 1.2s ease-in-out infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; }
  .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes jump { 0%,60%,100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-4px); opacity: 1; } }

  #chatFoot { padding: 10px 18px 18px; }
  .inputbar { max-width: 680px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end;
    background: var(--glass); border: 1px solid var(--line-strong); border-radius: 18px;
    padding: 9px 9px 9px 15px;
    backdrop-filter: blur(20px) saturate(140%); -webkit-backdrop-filter: blur(20px) saturate(140%);
    box-shadow: 0 12px 36px rgba(0,0,0,.3); transition: border-color var(--tr); }
  .inputbar:focus-within { border-color: rgba(124,92,255,.6);
    box-shadow: 0 12px 36px rgba(0,0,0,.3), 0 0 0 3px rgba(124,92,255,.15); }
  .inputbar textarea { flex: 1; border: none; resize: none; background: transparent; outline: none;
    color: var(--fg); font: inherit; font-size: 15px; line-height: 1.5; max-height: 120px;
    padding: 7px 0; }
  .inputbar textarea::placeholder { color: rgba(242,242,250,.35); }
  .btn-send { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
    background: var(--grad); color: #fff; border: none; border-radius: 13px; cursor: pointer;
    box-shadow: 0 6px 18px rgba(124,92,255,.4); transition: all var(--tr); }
  .btn-send:hover { filter: brightness(1.1); }
  .btn-clip { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
    background: transparent; border: 1px solid var(--line-strong); border-radius: 13px;
    color: var(--muted); cursor: pointer; transition: all var(--tr); }
  .btn-clip:hover { color: var(--fg); }

  /* 审批卡片 */
  #approvalBar { position: fixed; right: 20px; bottom: 20px; z-index: 90; width: 360px; }
  .approval-card { background: rgba(30,28,48,.85); border: 1px solid var(--line-strong);
    border-left: 3px solid #FFB454; border-radius: 16px; padding: 14px 16px;
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 18px 48px rgba(0,0,0,.5); }
  .approval-card h4 { margin: 0 0 6px; font-size: 13px; color: #FFD9A0; }
  .approval-card pre { margin: 6px 0 10px; font-size: 12px; white-space: pre-wrap; word-break: break-all;
    max-height: 120px; overflow: auto; background: rgba(0,0,0,.3); border-radius: 8px; padding: 8px;
    color: rgba(242,242,250,.75); }
  .acts { display: flex; gap: 8px; justify-content: flex-end; }
  .acts .abtn { border-radius: 10px; padding: 7px 13px; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all var(--tr); border: 1px solid var(--line-strong);
    background: transparent; color: var(--muted); }
  .acts .abtn:hover { color: var(--fg); }
  .acts .abtn.primary { background: var(--grad); border: none; color: #fff;
    box-shadow: 0 4px 14px rgba(124,92,255,.4); }
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<div id="app">
  <aside id="sidebar">
    <div class="brand"><div class="avatar">五</div><b>小五</b></div>
    <nav id="nav">
      <button class="nav-item active"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>聊天</button>
      <button class="nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>运行状态</button>
      <button class="nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>调用轨迹</button>
      <button class="nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>自动化</button>
      <button class="nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>待办</button>
      <button class="nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>记忆</button>
      <button class="nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>设置</button>
    </nav>
    <div class="grow"></div>
    <div id="whoBox">
      <div class="who-line"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>admin</div>
      <button id="btnLogout"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>退出登录</button>
    </div>
  </aside>

  <main id="main">
    <div id="chatHead">
      <div class="title">聊天</div>
      <button class="btn-icon"><svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg></button>
    </div>
    <div id="chatScroller">
      <div id="msgList">
        <div class="mrow user"><div class="bubble">帮我记个待办：周五早上还书</div></div>
        <div class="mrow bot"><div class="bubble">已记入待办 <b>周五早上还书</b>，到时我会提醒你 📚</div></div>
        <div class="mrow user"><div class="bubble">上海今天天气怎么样？</div></div>
        <div class="mrow bot"><div class="bubble">上海今天 <b>多云转晴</b>，22–27°C，东南风 3 级。
- 早晚偏凉，出门带件薄外套
- 午后紫外线较强，注意防晒</div></div>
        <div class="mrow bot"><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div></div>
      </div>
    </div>
    <div id="chatFoot">
      <div class="inputbar">
        <button class="btn-clip"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></button>
        <textarea rows="1" placeholder="和小五说点什么…"></textarea>
        <button class="btn-send"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button>
      </div>
    </div>
  </main>
</div>

<div id="approvalBar">
  <div class="approval-card">
    <h4>⚠️ 危险操作待审批</h4>
    <pre>exec: rm -rf /tmp/friday-cache</pre>
    <div class="acts">
      <button class="abtn">拒绝</button>
      <button class="abtn">批准并记住</button>
      <button class="abtn primary">批准</button>
    </div>
  </div>
</div>
</body>
</html>
