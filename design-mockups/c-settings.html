<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设置 · 小五</title>
<link rel="stylesheet" href="c.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand"><div class="avatar">五</div><b>小五</b><span class="ver">FRIDAY v1</span></div>
    <nav id="nav">
      <a class="nav-item" href="c-chat.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>聊天</a>
      <a class="nav-item" href="c-status.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>运行状态</a>
      <a class="nav-item" href="c-trace.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>调用轨迹</a>
      <a class="nav-item" href="c-auto.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>自动化</a>
      <a class="nav-item" href="c-todo.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>待办</a>
      <a class="nav-item" href="c-wiki.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>记忆</a>
      <a class="nav-item active" href="c-settings.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>设置</a>
    </nav>
    <div class="grow"></div>
    <div id="whoBox">
      <div class="who-line">admin</div>
      <button id="btnLogout">退出登录</button>
    </div>
  </aside>

  <main id="main">
    <section class="view">
      <div class="view-inner">
        <h2><span class="hl">设置</span></h2>

        <div class="panel">
          <div class="panel-title"><span class="tag">LLM</span>模型配置</div>
          <div class="form-col">
            <label>API 地址（baseURL）<input style="width:100%; margin-top:5px" value="https://api.stepfun.com/step_plan/v1"></label>
            <label>模型名（model）<input style="width:100%; margin-top:5px" value="step-3.7-flash"></label>
            <label>API 密钥<input style="width:100%; margin-top:5px" type="password" placeholder="已配置——留空保持不变，输入新值可覆盖"></label>
            <div><button class="btn primary">保存并热生效</button></div>
          </div>
          <div class="set-note">保存后立即热生效（无需重启，对话上下文保持连续），并写回 config.yaml。密钥任意 OpenAI 兼容服务商通用。</div>
        </div>

        <div class="panel">
          <div class="panel-title"><span class="tag"> persona </span>人设提示词</div>
          <div class="row" style="margin-bottom:10px">
            <select><option>贴心管家</option><option>严谨可靠</option><option>毒舌损友</option></select>
            <span class="meta">亲切干练，事事有回音（默认）</span>
            <span class="badge once">已自定义</span>
          </div>
          <textarea rows="5" style="width:100%">- 亲切干练，像一位靠谱的管家：说话简洁、事事有回音，不啰嗦也不刻意卖萌。
- 回答先给结论，再补必要细节；安排妥当后说一句"妥了"。</textarea>
          <div class="row" style="margin-top:10px">
            <button class="btn primary">应用并热生效</button>
            <button class="btn">＋ 新增自定义</button>
            <button class="btn">恢复内置</button>
            <button class="btn danger">删除自定义</button>
          </div>
        </div>

        <div class="panel">
          <div class="panel-title"><span class="tag">MCP</span>服务器 <span class="count" style="font-weight:700; color:var(--muted)">1 台</span></div>
          <table>
            <thead><tr><th>名称</th><th>方式</th><th>本地命令 / 远程地址</th><th>状态</th><th>操作</th></tr></thead>
            <tbody>
              <tr>
                <td><input value="fetch" style="width:88px"></td>
                <td><select style="padding:6px 8px"><option>本地命令</option><option>远程 URL</option></select></td>
                <td><input value="npx -y @modelcontextprotocol/server-fetch" style="width:100%; min-width:200px"></td>
                <td class="st-cell"><span class="dot ok"></span>在线 · 3 工具</td>
                <td style="white-space:nowrap"><button class="btn sm">重连</button> <button class="btn sm danger">删除</button></td>
              </tr>
            </tbody>
          </table>
          <div class="row" style="margin-top:12px">
            <button class="btn">＋ 添加服务器</button>
            <button class="btn primary">保存并生效</button>
          </div>
        </div>

        <div class="panel">
          <div class="panel-title"><span class="tag">INFO</span>当前配置</div>
          <table><tbody>
            <tr><td class="meta" style="width:120px">当前账号</td><td class="mono">admin</td></tr>
            <tr><td class="meta">LLM 模型</td><td class="mono">step-3.7-flash</td></tr>
            <tr><td class="meta">任务文件</td><td class="mono">tasks.json</td></tr>
            <tr><td class="meta">记忆目录</td><td class="mono">memories</td></tr>
            <tr><td class="meta">服务地址</td><td class="mono">localhost:8080</td></tr>
          </tbody></table>
        </div>

        <button class="btn danger" style="margin-top:20px">退出登录</button>
      </div>
    </section>
  </main>
</div>
</body>
</html>
