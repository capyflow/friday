<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Friday</title>
<!--
  全局快捷键弹窗页（桌面外壳 Alt+Space 创建的透明无边框窗口加载本页）。
  放在 Go 侧是刻意设计（docs/DESKTOP.md）：与主窗口同源共享登录会话、
  浏览器直接访问 :port/palette 亦可用。同源 POST /api/chat 流式渲染。
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 10px;
    -webkit-user-select: none; user-select: none;
  }
  #panel {
    display: flex; flex-direction: column;
    height: 100%;
    border-radius: 14px;
    background: rgba(24, 24, 30, .92);
    box-shadow: 0 12px 48px rgba(0, 0, 0, .45), inset 0 0 0 1px rgba(255, 255, 255, .08);
    overflow: hidden;
    color: #ececf1;
  }
  #inputRow {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px;
    border-bottom: 1px solid rgba(255, 255, 255, .08);
  }
  #logo { width: 22px; height: 22px; border-radius: 6px; flex: none;
    background: linear-gradient(160deg, #6366f1, #8b5cf6); position: relative; }
  #logo::after { content: ""; position: absolute; inset: 6px; border-radius: 50%;
    background: rgba(255, 255, 255, .9); }
  #q {
    flex: 1; background: transparent; border: 0; outline: 0;
    color: #ececf1; font-size: 17px; caret-color: #8b5cf6;
  }
  #q::placeholder { color: rgba(236, 236, 241, .35); }
  #hint { font-size: 11px; color: rgba(236, 236, 241, .35); flex: none; }
  #answer {
    flex: 1; overflow-y: auto; padding: 14px 18px;
    font-size: 14px; line-height: 1.65; white-space: pre-wrap; word-break: break-word;
    -webkit-user-select: text; user-select: text;
  }
  #answer:empty::before {
    content: "直接输入问题，Enter 发送；Esc 关闭。";
    color: rgba(236, 236, 241, .35);
  }
  #answer.err { color: #f87171; }
  #status { padding: 6px 18px 12px; font-size: 12px; color: rgba(236, 236, 241, .45); }
  #status:empty { display: none; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .15); border-radius: 3px; }
</style>
</head>
<body>
  <div id="panel">
    <div id="inputRow">
      <div id="logo"></div>
      <input id="q" type="text" placeholder="问小五任何事，或让它安排事项…" autofocus autocomplete="off" spellcheck="false">
      <span id="hint">Esc 关闭</span>
    </div>
    <div id="answer"></div>
    <div id="status"></div>
  </div>
<script>
  const q = document.getElementById('q');
  const answer = document.getElementById('answer');
  const statusEl = document.getElementById('status');
  let busy = false;

  // Esc 隐藏窗口（外壳侧失焦也会隐藏；此处保证按键路径）。
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { e.preventDefault(); hideWindow(); }
  });

  function hideWindow() {
    try {
      const win = window.__TAURI__ && window.__TAURI__.window && window.__TAURI__.window.getCurrentWindow();
      if (win) { win.hide(); return; }
    } catch (_) { /* 外壳不可用（浏览器直接访问）时降级 */ }
    window.close();
  }

  q.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); ask(); }
  });

  async function ask() {
    const text = q.value.trim();
    if (!text || busy) return;
    busy = true;
    q.value = '';
    answer.classList.remove('err');
    answer.textContent = '';
    statusEl.textContent = '思考中…';
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text }),
      });
      if (res.status === 401) {
        answer.classList.add('err');
        answer.textContent = '还未登录：请先打开 Friday 主窗口登录，再回来使用。';
        statusEl.textContent = '';
        return;
      }
      if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);
      const reader = res.body.getReader();
      const decoder = new TextDecoder('utf-8');
      let buf = '';
      for (;;) {
        const r = await reader.read();
        if (r.done) break;
        buf += decoder.decode(r.value, { stream: true });
        let idx;
        while ((idx = buf.indexOf('\n\n')) >= 0) {
          const chunk = buf.slice(0, idx);
          buf = buf.slice(idx + 2);
          if (!chunk.startsWith('data:')) continue;
          let data;
          try { data = JSON.parse(chunk.slice(5).trim()); } catch (_) { continue; }
          if (data.error) {
            answer.classList.add('err');
            answer.textContent += (answer.textContent ? '\n' : '') + data.error;
          } else if (data.delta) {
            answer.textContent += data.delta;
            answer.scrollTop = answer.scrollHeight;
          }
        }
      }
      statusEl.textContent = '';
    } catch (e) {
      answer.classList.add('err');
      answer.textContent = '连接不上小五（' + e.message + '）。';
    } finally {
      busy = false;
      q.focus();
    }
  }

  q.focus();
</script>
</body>
</html>
